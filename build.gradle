plugins {
    id 'java'
    id 'maven-publish'
    id 'application'
}

group = 'com.moubassher'
version = '1.0.0'

repositories {
    mavenCentral()
    mavenLocal()
}

application {
    mainClass = 'com.moubassher.accountsfx.Launcher'

}


def javafxVersion = '23.0.1'


dependencies {

    implementation 'com.context.themes:my-vibrant-blue-theme:1.0.0'

    implementation 'com.moubassher:searcher:4.1.0'

    implementation 'io.github.mkpaz:atlantafx-base:2.1.0'
    implementation "org.openjfx:javafx-base:${javafxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:win"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:win"
    implementation "org.openjfx:javafx-media:${javafxVersion}:win"

    implementation 'org.xerial:sqlite-jdbc:3.40.1.0'

    implementation "org.json:json:20250107"

    implementation 'org.controlsfx:controlsfx:11.2.2'

    implementation "at.favre.lib:bcrypt:0.10.2"
    implementation 'com.jfoenix:jfoenix:9.0.1'

    implementation 'com.context:my-javafx-utilities:2.1.0'
    implementation 'com.context:my_utilities:1.0.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

}

/*run {
    jvmArgs = [
            "--module-path", configurations.runtimeClasspath.asPath,
            "--add-modules", "javafx.controls,javafx.fxml,javafx.media"
    ]

    jvmArgs += "--add-opens"
    jvmArgs += "java.base/java.lang.reflect=ALL-UNNAMED"
}*/


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

/*tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:rawtypes", "-Werror"]
}*/

test {
    useJUnitPlatform()
}