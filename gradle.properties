# Enable Gradle Daemon (keeps JVM alive between builds)
org.gradle.daemon=true

# Enable build cache to reuse task outputs
org.gradle.caching=true

# Enable parallel execution (for multi-module projects)
org.gradle.parallel=true

# Only configure modules that are needed
org.gradle.configureondemand=true

# Increase JVM heap size for Gradle (optional but helps for large projects)
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8